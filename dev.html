<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer - WebGL Dev</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background: #1e1e1e;
color: #e0e0e0;
display: flex;
flex-direction: column;
height: 100vh;
}
header {
padding: 1rem;
background: #252526;
border-bottom: 1px solid #3e3e42;
}
#canvas {
flex: 1;
background: #000;
}
footer {
padding: 0.5rem 1rem;
background: #252526;
border-top: 1px solid #3e3e42;
font-size: 0.9rem;
}
</style>
</head>
<body>
<header>
<h1>WebGL 3D Viewer - Development Preview</h1>
</header>
<canvas id="canvas"></canvas>
<footer>
<p>Canvas size: <span id="canvas-size"></span> | WebGL version: <span id="webgl-version"></span></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.4/gl-matrix-min.js"></script>
<script src="main.js"></script>
<script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
document.body.innerHTML = '<h1 style="color: red; padding: 2rem;">WebGL not supported</h1>';
} else {
// Resize canvas to fit window
function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 80; // Account for header/footer
gl.viewport(0, 0, canvas.width, canvas.height);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Update canvas size info
document.getElementById('canvas-size').textContent = `${canvas.width}x${canvas.height}`;
document.getElementById('webgl-version').textContent = gl.getParameter(gl.VERSION);

// Call our main function to render the cube
main(canvas);
}
</script>
</body>
</html>
